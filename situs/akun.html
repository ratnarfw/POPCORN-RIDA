<body>

      <ul class="breadcrumb">
        <li><a href="index.html">Beranda</a></li>
        <li>Akun Saya</li>
      </ul>
    </div>
  </div>

  <main id="main-content" class="container" tabindex="-1">
    <div class="akun-layout">
      <aside class="akun-side" aria-label="Menu akun">
        <div class="ak-id">
          <span class="ak-avatar" id="ak-avatar">?</span>
          <h2 id="ak-nama">Memuat…</h2>
          <p id="ak-email"></p>
          <span class="badge primary" id="ak-role" style="margin-top:8px;"></span>
        </div>
        <nav class="akun-nav" id="akun-nav">
          <button type="button" data-panel="profil" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profil</button>
          <button type="button" data-panel="favorit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 000-7.8z"/></svg> Rak Favorit <span class="count" id="cnt-fav">0</span></button>

          <a href="admin.html" class="btn btn-ghost btn-sm btn-block" id="ak-admin" style="margin-top:10px;" hidden>Buka Dashboard Admin</a>
          <button type="button" id="ak-logout" style="color:var(--c-danger);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg> Keluar</button>
        </nav>
      </aside>

      <section class="akun-panel" id="akun-content" aria-live="polite"></section>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast-container" class="toast-container"></div>
